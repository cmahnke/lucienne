name: 🐞 Bug Report
description: Something not working as expected? Let us know!
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Oh no, something went wrong! 😅 Help us help you by sharing what happened.
        Don't worry about being too technical — just describe what you saw!

  - type: textarea
    id: description
    attributes:
      label: 🐞 What went wrong?
      description: Describe what happened in plain words.
      placeholder: "When I tried to... it didn't work / showed an error / crashed..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🔁 How can we reproduce it?
      description: Walk us through what you did before the issue appeared.
      placeholder: |
        1. I opened...
        2. Then I clicked / ran...
        3. And then...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ What did you expect to happen?
      placeholder: "I expected it to..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ What actually happened?
      placeholder: "Instead, it..."
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: 🎥 Screenshots or Screen Recording
      description: |
        A picture is worth a thousand words! Please attach any screenshots or a short screen recording showing the issue.
        You can drag and drop files directly into this field.
      placeholder: "Drag & drop screenshots or a screen recording here..."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 📋 Error Messages
      description: If you see any error messages, paste them here.
      render: shell
      placeholder: "Paste any error messages here..."
    validations:
      required: false

  - type: input
    id: plugin-version
    attributes:
      label: 📦 Lucienne Version
      description: Which version are you using? You can find this in your package.json.
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: 🌐 Browser
      description: Which browser were you using when the issue occurred?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Opera
        - Other
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: 🔢 Browser Version
      description: Not sure? Check your browser's About page (usually under Help or Settings).
      placeholder: "e.g. 120.0.6099.109"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: 🟢 Node.js Version
      description: Not sure? Run `node --version` in your terminal.
      placeholder: "e.g. 20.11.0"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: 💻 Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 📝 Anything else?
      description: Any other details that might help us track this down — config snippets, file structure, links, etc.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Quick Checklist
      options:
        - label: I am using the latest version of Lucienne
          required: true
        - label: I checked existing issues and this hasn't been reported yet
          required: true
        - label: I included a screenshot or recording (if applicable)
          required: false
