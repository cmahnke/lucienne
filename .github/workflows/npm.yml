# See https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages
name: Publish package to Package registries
on:
  release:
    types: [published]
jobs:
  # Playwright tests must pass before anything is published
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"
      - run: |
          npm i
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-release
          path: playwright-report/
          retention-days: 7

  publish_gpr:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Setup .npmrc file to publish to GitHub Packages
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"
          scope: "@cmahnke"
          always-auth: true
      - run: cat $NPM_CONFIG_USERCONFIG
      - run: sed -i '2,2s/@projektemacher\/lucienne/@cmahnke\/lucienne/g' package.json
      - run: npm i
      - run: npm run build
      - run: |
          echo registry=https://npm.pkg.github.com/ > .npmrc
          echo always-auth=true >> .npmrc
          echo '//npm.pkg.github.com/cmahnke:_authToken=${{ secrets.GITHUB_TOKEN }} @cmahnke:registry=https://npm.pkg.github.com/cmahnke' >> .npmrc
      - run: npm publish --verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_npm:
    needs: e2e
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
      - run: npm i
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
